name: Build SILENT CALIBER APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android

      - name: Build release APK (unsigned)
        run: cordova build android --release -- --packageType=apk

      - name: Find unsigned APK
        run: |
          UNSIGNED_APK=$(find platforms/android -name "*.apk" | grep -i unsigned | head -1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find platforms/android -name "*.apk" | head -1)
          fi
          echo "Found: $UNSIGNED_APK"
          echo "UNSIGNED_APK=$UNSIGNED_APK" >> $GITHUB_ENV

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Align APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          "${BUILD_TOOLS}zipalign" -v -p 4 "$UNSIGNED_APK" aligned.apk
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> $GITHUB_ENV

      - name: Sign APK with apksigner (v2 scheme)
        run: |
          "${BUILD_TOOLS}apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out SilentCaliber-release-signed.apk \
            aligned.apk

      - name: Verify signature
        run: "${BUILD_TOOLS}apksigner" verify --verbose SilentCaliber-release-signed.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentCaliber-release-signed
          path: SilentCaliber-release-signed.apk
