name: Build SILENT CALIBER APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android

      - name: Build release APK (unsigned)
        run: cordova build android --release

      - name: List all APKs (debug)
        run: find . -name "*.apk" -exec ls -la {} \;

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Sign APK
        run: |
          UNSIGNED_APK=$(find . -name "*.apk" | grep -i unsigned | head -1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find . -name "*.apk" | head -1)
          fi
          echo "Found APK: $UNSIGNED_APK"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            "$UNSIGNED_APK" "${{ secrets.KEY_ALIAS }}"
          echo "SIGNED_APK=$UNSIGNED_APK" >> $GITHUB_ENV

      - name: Align APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          "${BUILD_TOOLS}zipalign" -v 4 "$SIGNED_APK" SilentCaliber-release-signed.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentCaliber-release-signed
          path: SilentCaliber-release-signed.apk
